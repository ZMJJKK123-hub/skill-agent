<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM MAINTENANCE — Debug Playground</title>
  <!-- 页面可能从 / 、/debug 、/debug/ 或 Nginx 502 内部重写等路径返回，统一锚定资源基准 -->
  <base href="/debug/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bgParticles"></canvas>

  <div id="app">
    <div class="topbar">
      <div class="left">
        <span class="clock" id="clock">00:00:00</span>
        <span class="banner">SYSTEM MAINTENANCE IN PROGRESS</span>
        <div class="progress-wrap">
          <span class="progress-label">REPAIR</span>
          <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
          <span class="progress-pct" id="progPct">0%</span>
        </div>
      </div>
      <div class="right">
        <div class="icon-btn" id="soundBtn" title="Sound">🔇</div>
        <div class="icon-btn" id="homeBtn" title="Retry Home">⟳</div>
      </div>
    </div>

    <div class="main">
      <div class="desktop">
        <div class="desktop-title">// MAINTENANCE PROTOCOL APPLICATIONS</div>
        <div class="app-grid" id="appGrid"></div>
      </div>
      <div class="log-panel">
        <div class="log-title">SYSTEM LOG</div>
        <div class="log-body" id="logBody"></div>
      </div>
    </div>
  </div>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="title" id="modalTitle">Game</span>
        <button class="close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="konamiCheat">
    <h2>🎮 CHEAT MENU (CJB)</h2>
    <div class="cheat-item" id="cheatGod"><span>God Mode (unlock max scores)</span><div class="switch"></div></div>
    <div class="cheat-item" id="cheatGravity"><span>Gravity Anomaly (elements fall)</span><div class="switch"></div></div>
    <div class="cheat-item" id="cheatDeploy"><span>One-Click Deploy (go home)</span><div class="switch"></div></div>
  </div>

  <div id="toast"></div>

  <div class="health-indicator">
    <span class="hdot red" id="hDot"></span>
    <span id="hText">Checking...</span>
  </div>

  <!-- Scripts: utils first, then games, then main -->
  <script src="js/utils.js"></script>
  <script src="js/games/server-defense.js"></script>
  <script src="js/games/terminal-hacker.js"></script>
  <script src="js/games/snake-2048.js"></script>
  <script src="js/games/casino.js"></script>
  <script src="js/games/casino-showhand.js"></script>
  <script src="js/games/traffic-breakout.js"></script>
  <script src="js/games/dimension-parkour.js"></script>
  <script src="js/games/bug-sorter.js"></script>
  <script src="js/games/data-turing.js"></script>
  <script>
    // Register apps (must run after all game classes are defined, before main.js)
    // 当前只上线 Snake 2048；其余游戏代码保留，取消注释即可复原。
    window.APPS = [
      // { icon: '🛡️', name: 'Server Defense', desc: 'Vampire Survivors tower defense', badge: 'HOT', init: c => new ServerDefense(c) },
      // { icon: '💻', name: 'Terminal Hacker', desc: 'Decrypt threat defense', init: c => new TerminalHacker(c) },
      { icon: '🐍', name: 'Snake 2048', desc: 'Snake x 2048 fusion', badge: 'NEW', init: c => new Snake2048(c) },
      { icon: '🎰', name: '算力赌坊', desc: 'Casino hub: 梭哈 Show Hand', badge: 'HOT', init: c => new CasinoHub(c) },
      // { icon: '🧱', name: 'Traffic Breakout', desc: 'Tunnel + fork breakout', init: c => new TrafficBreakout(c) },
      // { icon: '🏃', name: 'Dimension Parkour', desc: 'Gravity flip runner', badge: 'NEW', init: c => new DimensionParkour(c) },
      // { icon: '🎵', name: 'Bug Sorter', desc: '3-lane rhythm game', init: c => new BugSorter(c) },
      // { icon: '🔌', name: 'Data Turing', desc: 'Node wiring puzzle', init: c => new DataTuring(c) }
    ];
    // init() in main.js uses DOMContentLoaded, so it will pick up APPS
  </script>
  <script src="js/main.js"></script>
</body>
</html>
