[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-agent"
version = "0.1.0"
description = "12课 Agent 引擎（core）+ MOD 制作器网站（server_app）"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["skills/*/SKILL.md"]