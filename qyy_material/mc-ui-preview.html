<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Mod生成 - UI预览</title>
<style>
/* ============ CSS Variables & Reset ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #d1d5db;
  font-family: 'Courier New', 'Consolas', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============ Voxel粒子背景 ============ */
.voxel-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.voxel-particle {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(52,211,153,0.3);
  animation: xpFloat 8s linear infinite;
  image-rendering: pixelated;
}
@keyframes xpFloat {
  0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.8; }
  50%  { transform: translateY(45vh) translateX(30px) rotate(180deg); }
  90%  { opacity: 0.3; }
  100% { transform: translateY(-5vh) translateX(-20px) rotate(360deg); opacity: 0; }
}

/* ============ Layout ============ */
.app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  color: #9ca3af; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 13px; transition: all 0.2s;
}
.btn-ghost:hover { color: #e5e7eb; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
.session-id { font-size: 11px; color: #52525b; }

.grid-2 { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
@media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

/* ============ Glass卡片 ============ */
.glass {
  background: rgba(10,10,10,0.85); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 4px 30px rgba(0,0,0,0.8);
  overflow: hidden;
}
.glass-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(0,0,0,0.3);
}
.glass-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ============ MC XP Bar ============ */
.xp-bar-wrap { position: relative; }
.xp-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.xp-label { font-size: 11px; color: #9ca3af; letter-spacing: 0.05em; }
.xp-level-num {
  font-size: 18px; font-weight: bold; font-variant-numeric: tabular-nums;
  transition: color 0.3s; text-shadow: 0 2px 0 rgba(0,0,0,0.8);
}
.xp-level-num.running { color: #55FF55; }
.xp-level-num.finished { color: #00FF00; text-shadow: 0 0 10px rgba(0,255,0,0.7), 0 2px 0 rgba(0,0,0,0.8); }
.xp-level-num.glow { color: #80FF00; text-shadow: 0 0 8px rgba(128,255,0,0.6), 0 2px 0 rgba(0,0,0,0.8); }
.xp-max { font-size: 11px; color: #52525b; }

.xp-track {
  position: relative; height: 16px; overflow: hidden;
  border: 2px solid #2a2a2a; background: #0d0d0d;
  image-rendering: pixelated;
}
.xp-track-bg {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.25) 3px, rgba(0,0,0,0.25) 4px);
}
.xp-fill {
  position: relative; height: 100%; transition: width 0.5s ease-out;
  background: linear-gradient(180deg, #3CB043, #50C878, #2E8B57);
}
.xp-fill.finished { background: linear-gradient(180deg, #00FF00, #33FF33, #00CC00); }
.xp-fill-shine {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.12) 2px, rgba(255,255,255,0.12) 3px);
}
.xp-fill-highlight { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.2); }
.xp-shine-anim {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: xpShine 2s ease-in-out infinite;
}
@keyframes xpShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
.xp-segments { position: absolute; inset: 0; }
.xp-seg { position: absolute; top: 0; height: 100%; width: 1px; background: rgba(0,0,0,0.2); }
.xp-glow-flash {
  position: absolute; inset: 0; background: rgba(255,255,255,0.3);
  animation: levelUpFlash 0.3s ease-out;
}
@keyframes levelUpFlash {
  0% { opacity: 0.8; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}
@keyframes floatAway {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-16px); }
}
.xp-level-pop {
  position: absolute; top: -28px; right: 0; pointer-events: none;
  animation: fadeUp 0.3s ease, floatAway 1.5s ease-out forwards;
}
@keyframes fadeUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
.xp-level-pop span {
  font-size: 11px; font-weight: bold; color: #80FF00;
  text-shadow: 0 0 8px rgba(128,255,0,0.8), 0 2px 0 rgba(0,0,0,0.8);
}

/* ============ Phase indicators ============ */
.phases { display: flex; gap: 8px; padding-top: 4px; }
.phase-item { flex: 1; text-align: center; }
.phase-icon {
  margin: 0 auto; width: 32px; height: 32px; display: flex;
  align-items: center; justify-content: center; font-size: 16px;
  border-radius: 2px; border: 1px solid transparent;
  transition: all 0.3s; image-rendering: pixelated;
}
.phase-icon.inactive { background: #111; border-color: #1a1a1a; opacity: 0.4; filter: grayscale(1); }
.phase-icon.done { background: #0a2a0a; border-color: rgba(42,90,42,0.3); }
.phase-icon.active { background: #1a3a1a; border-color: rgba(85,255,85,0.5); transform: scale(1.1); box-shadow: 0 0 12px rgba(85,255,85,0.4); }
.phase-label { margin-top: 4px; display: block; font-size: 10px; font-weight: bold; }
.phase-label.inactive { color: #3f3f46; }
.phase-label.done { color: #3a7a3a; }
.phase-label.active { color: #55FF55; text-shadow: 0 0 4px rgba(85,255,85,0.5); }

/* ============ Info cards ============ */
.divider { height: 1px; background: rgba(255,255,255,0.05); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-card {
  padding: 12px; border: 1px solid #373737; border-radius: 4px;
  background: rgba(0,0,0,0.4); image-rendering: pixelated;
}
.info-card-label { font-size: 10px; color: #6b7280; letter-spacing: 0.05em; }
.info-card-value {
  margin-top: 4px; font-size: 16px; font-weight: bold;
  color: #55FF55;
}
.info-card-value.finished { color: #00FF00; text-shadow: 0 0 6px rgba(0,255,0,0.5); }
.btn-row { display: flex; gap: 8px; padding-top: 4px; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px; flex: 1;
  justify-content: center; padding: 10px 16px; border-radius: 8px;
  background: rgba(6,78,59,0.5); border: 1px solid rgba(6,78,59,0.8);
  color: #34d399; font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.btn-primary:hover { background: rgba(6,78,59,0.6); box-shadow: 0 0 12px rgba(52,211,153,0.5); }
.btn-primary:disabled { opacity: 0.4; pointer-events: none; }

/* ============ Terminal (event timeline) ============ */
.terminal {
  background: #0d0d0d; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  overflow: hidden;
}
.terminal-header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05); background: #151515;
}
.terminal-events {
  max-height: 500px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px;
}
.event-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; transition: background 0.15s; }
.event-row:hover { background: rgba(255,255,255,0.02); }
.event-icon { margin-top: 2px; flex-shrink: 0; font-size: 13px; }
.event-icon.thinking { color: rgba(251,191,36,0.8); }
.event-icon.tool { color: rgba(96,165,250,0.8); }
.event-icon.todo { color: #34d399; }
.event-content { min-width: 0; flex: 1; }
.event-type { font-size: 11px; color: #d1d5db; }
.event-toolname { color: rgba(34,211,238,0.8); }
.event-msg { margin-top: 2px; font-size: 11px; color: #9ca3af; white-space: pre-wrap; word-break: break-all; }
.event-time { font-size: 10px; color: #52525b; flex-shrink: 0; margin-top: 2px; }
.event-anim { animation: fadeUp 0.3s ease; }

/* ============ Enchant Overlay ============ */
.enchant-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.9);
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.enchant-overlay.active { opacity: 1; pointer-events: all; }
.enchant-particles { position: absolute; inset: 0; overflow: hidden; }
.enchant-rune {
  position: absolute; font-family: monospace;
  animation: floatRune 3s ease-in-out infinite;
}
@keyframes floatRune {
  0% { transform: translateY(20px) rotate(0deg); opacity: 0; }
  30% { opacity: 0.8; }
  70% { opacity: 0.5; }
  100% { transform: translateY(-50px) rotate(180deg); opacity: 0; }
}
.book-container {
  position: relative; transition: all 0.7s;
  perspective: 800px;
}
.book-container.appear { animation: bookAppear 0.6s ease-out; }
.book-container.flip { animation: bookFlip 0.8s ease-in-out; }
.book-container.enchanting { transform: scale(1.1); }
.book-container.enchanted { transform: scale(1.05); }
@keyframes bookAppear {
  0% { opacity: 0; transform: scale(0.5) rotateY(90deg); }
  100% { opacity: 1; transform: scale(1) rotateY(0deg); }
}
@keyframes bookFlip {
  0% { transform: rotateY(0deg); }
  50% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}
.orbit-ring {
  position: absolute; border-radius: 50%; border-style: dashed;
  animation: spin linear infinite;
}
.orbit-ring.ring1 { inset: -24px; border: 2px dashed rgba(170,0,255,0.4); animation-duration: 4s; }
.orbit-ring.ring2 { inset: -40px; border: 1px dashed rgba(0,255,170,0.25); animation-duration: 3s; animation-direction: reverse; }
.orbit-ring.ring3 { inset: -56px; border: 1px dashed rgba(255,215,0,0.15); animation-duration: 5s; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.book {
  position: relative; width: 320px; height: 256px; transition: all 0.5s;
  border-radius: 6px; border: 3px solid #5D4037;
  background: linear-gradient(135deg, #6D4C41, #3E2723);
  box-shadow: 0 0 40px rgba(139,69,19,0.4);
}
.book.enchanted {
  border-color: #AA00FF;
  background: linear-gradient(135deg, #1a0020, #0d0015);
  box-shadow: 0 0 80px rgba(170,0,255,0.7), 0 0 200px rgba(170,0,255,0.2);
}
.book-spine {
  position: absolute; left: 0; top: 0; height: 100%; width: 24px;
  border-radius: 4px 0 0 4px;
  background: linear-gradient(90deg, #4E342E, #5D4037);
  border-right: 1px solid rgba(62,39,35,0.5);
}
.book-inner {
  position: absolute; left: 24px; right: 0; top: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px;
}
.book-emoji {
  font-size: 48px; margin-bottom: 12px;
  filter: drop-shadow(0 0 20px rgba(170,0,255,0.9));
}
@keyframes enchGlow { 0%, 100% { opacity: 0.6; filter: brightness(1); } 50% { opacity: 1; filter: brightness(1.5); } }
.book-title {
  font-size: 28px; font-weight: bold; letter-spacing: 0.1em;
  color: #FF00FF;
  text-shadow: 0 0 20px rgba(255,0,255,0.9), 0 0 40px rgba(170,0,255,0.7), 0 0 80px rgba(170,0,255,0.4);
  animation: enchGlow 0.8s ease-in-out infinite;
}
.book-text {
  font-size: 16px; color: #D7CCC8; font-weight: bold;
  text-shadow: 0 2px 0 rgba(0,0,0,0.5);
}
.book-content-box {
  width: 200px; text-align: center; padding: 8px 12px; border-radius: 4px;
  background: rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.05);
}
.book-content-text {
  font-size: 11px; line-height: 1.5; color: #BCAAA4;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.rune-row { margin-top: 12px; display: flex; gap: 2px; opacity: 0.7; }
.rune-char { font-size: 11px; animation: enchGlow 0.6s ease-in-out infinite; }
.xp-orbs { position: absolute; bottom: -56px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.xp-orb {
  width: 12px; height: 12px; border-radius: 50%;
  animation: xpOrbFloat 1.5s ease-out infinite;
  image-rendering: pixelated;
}
@keyframes xpOrbFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  30% { opacity: 1; transform: translateY(-10px) scale(1); }
  100% { transform: translateY(-40px) scale(0.3); opacity: 0; }
}
.bottom-text {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center;
  font-size: 16px; font-weight: bold;
  text-shadow: 0 0 12px rgba(0,255,170,0.8);
}
.bottom-text.enchanted-text { color: #FF00FF; text-shadow: 0 0 12px rgba(255,0,255,0.8); }

/* ============ Simulator button ============ */
.sim-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding: 12px 16px; border-radius: 8px;
  background: rgba(0,0,0,0.4); border: 1px solid #373737;
}
.sim-btn {
  padding: 8px 18px; border: none; border-radius: 6px;
  background: #3CB043; color: #000; font-weight: bold; font-family: inherit;
  font-size: 13px; cursor: pointer; transition: all 0.2s;
  image-rendering: pixelated;
}
.sim-btn:hover { background: #50C878; }
.sim-btn.running { background: #c0392b; color: #fff; }
.sim-info { font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>

<!-- Voxel background -->
<div class="voxel-bg" id="voxelBg"></div>

<!-- ============ Enchant Overlay ============ -->
<div class="enchant-overlay" id="enchantOverlay">
  <div class="enchant-particles" id="enchantParticles"></div>
  
  <!-- Book container -->
  <div class="book-container" id="bookContainer">
    <!-- Orbit rings -->
    <div class="orbit-ring ring1" id="ring1" style="display:none"></div>
    <div class="orbit-ring ring2" id="ring2" style="display:none"></div>
    <div class="orbit-ring ring3" id="ring3" style="display:none"></div>
    
    <!-- Book -->
    <div class="book" id="book">
      <div class="book-spine"></div>
      <div class="book-inner" id="bookInner">
        <!-- Filled by JS -->
      </div>
    </div>
    
    <!-- XP Orbs -->
    <div class="xp-orbs" id="xpOrbs" style="display:none"></div>
  </div>
  
  <div class="bottom-text" id="bottomText"></div>
</div>

<!-- ============ Main App ============ -->
<div class="app">
  <!-- Simulator controls -->
  <div class="sim-bar">
    <button class="sim-btn" id="simBtn" onclick="toggleSimulation()">▶ 模拟Agent运行</button>
    <span class="sim-info" id="simInfo">点击按钮模拟Mod生成过程，观察经验条增长和附魔动画</span>
  </div>

  <div class="header">
    <button class="btn-ghost" onclick="resetAll()">🏠 返回首页</button>
    <span class="session-id" id="sessionId">session_abc123</span>
  </div>

  <div class="grid-2">
    <!-- Left: MC Panel -->
    <div class="glass">
      <div class="glass-header">
        <span style="font-size:13px;font-weight:bold;color:#BFBFBF;">生成状态</span>
        <span style="margin-left:auto;font-size:11px;color:#6b7280;">minecraft</span>
      </div>
      <div class="glass-body">
        <!-- XP Bar -->
        <div class="xp-bar-wrap">
          <div class="xp-label-row">
            <span class="xp-label">经验值</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="xp-level-num" id="xpLevelNum">0</span>
              <span class="xp-max">/ 30</span>
            </div>
          </div>
          <div class="xp-track" id="xpTrack">
            <div class="xp-track-bg"></div>
            <div class="xp-fill" id="xpFill" style="width:0%">
              <div class="xp-fill-shine"></div>
              <div class="xp-fill-highlight"></div>
              <div class="xp-shine-anim" id="xpShine"></div>
              <div class="xp-segments" id="xpSegs"></div>
            </div>
            <div id="xpGlowFlash"></div>
          </div>
          <div class="xp-level-pop" id="xpLevelPop" style="display:none"><span id="xpLevelPopText"></span></div>
        </div>

        <!-- Phase indicators -->
        <div class="phases" id="phaseIndicators"></div>

        <div class="divider"></div>

        <!-- Status + Time -->
        <div class="info-grid">
          <div class="info-card">
            <div class="info-card-label">状态</div>
            <div class="info-card-value" id="statusVal" style="color:#9ca3af;">等待中</div>
          </div>
          <div class="info-card">
            <div class="info-card-label">已用时间</div>
            <div class="info-card-value" id="timeVal">00:00</div>
          </div>
        </div>

        <!-- Stats -->
        <div class="info-card">
          <div class="info-card-label">产物统计</div>
          <div style="margin-top:4px;font-size:13px;color:#d1d5db;" id="fileStats">尚无文件</div>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
          <button class="btn-primary" id="dlBtn" disabled onclick="alert('模拟下载: mod.zip')">⬇ 下载 mod.zip</button>
          <button class="btn-ghost" onclick="resetAll()">🔄 重新生成</button>
        </div>
      </div>
    </div>
    
    <!-- Right: Terminal -->
    <div class="terminal">
      <div class="terminal-header">
        <span style="font-size:13px;font-weight:bold;color:#BFBFBF;">智能体工作台</span>
        <span style="margin-left:auto;font-size:11px;color:#52525b;" id="eventCount">0 事件</span>
      </div>
      <div class="terminal-events" id="terminalEvents">
        <div style="text-align:center;padding:80px 20px;color:#52525b;font-size:13px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2s ease-in-out infinite;margin-right:8px;"></span>
          等待智能体输出...
        </div>
        <style>@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }</style>
      </div>
    </div>
  </div>
</div>

<script>
// ============ Audio Engine ============
function playLevelUpSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [1200, 1600].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.08);
      gain.gain.setValueAtTime(0.25, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
    });
    setTimeout(() => ctx.close(), 1000);
  } catch(e) {}
}

function playEnchantSound(callback) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    
    // Drone
    [80, 120].forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f, now);
      o.frequency.linearRampToValueAtTime(f * 0.5, now + 2.0);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 2.5);
    });
    
    // Rising
    [200,300,400,520,660,800,1000,1200,1400].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, now + 1.0 + i * 0.12);
      g.gain.setValueAtTime(0.12, now + 1.0 + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, now + 1.0 + i * 0.12 + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + 1.0 + i * 0.12); o.stop(now + 1.0 + i * 0.12 + 0.3);
    });
    
    // Boom
    [150,300,450,600,900,1200].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i < 3 ? 'square' : 'sine';
      o.frequency.setValueAtTime(f * 2, now + 2.2);
      o.frequency.exponentialRampToValueAtTime(f, now + 3.0);
      g.gain.setValueAtTime(0.15, now + 2.2);
      g.gain.exponentialRampToValueAtTime(0.001, now + 3.0);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + 2.2); o.stop(now + 3.0);
    });
    
    setTimeout(() => { ctx.close(); if(callback) callback(); }, 3200);
  } catch(e) { if(callback) callback(); }
}

// ============ State ============
let state = {
  running: false,
  finished: false,
  events: [],
  displayLevel: 0,
  prevFloored: 0,
  xpGlow: false,
  enchantPhase: 'idle', // idle|bookAppear|reading|flip|enchanting|enchanted|done
  enchantTimers: [],
  promptText: ''
};

const PHASES = ['思考', '执行', '生成', '附魔完成!'];
const ICONS = ['📖', '⛏️', '🔧', '📚'];
const EVENT_TYPES = [
  { type: 'thinking', label: '思考', icon: '🧠', color: 'thinking' },
  { type: 'tool_call', label: '工具调用', icon: '🔧', color: 'tool' },
  { type: 'todo', label: '待办', icon: '📋', color: 'todo' },
  { type: 'system', label: '系统', icon: '💻', color: 'thinking' },
];

// ============ Render ============
function buildSegments() {
  const segs = document.getElementById('xpSegs');
  segs.innerHTML = '';
  for (let i = 1; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'xp-seg';
    s.style.left = (i / 30 * 100) + '%';
    segs.appendChild(s);
  }
}

function buildPhases() {
  const container = document.getElementById('phaseIndicators');
  container.innerHTML = '';
  PHASES.forEach((label, i) => {
    const div = document.createElement('div');
    div.className = 'phase-item';
    div.innerHTML = `
      <div class="phase-icon inactive" id="phaseIcon${i}">${ICONS[i]}</div>
      <span class="phase-label inactive" id="phaseLabel${i}">○ ${label}</span>
    `;
    container.appendChild(div);
  });
}

function updatePhases(activePhase) {
  for (let i = 0; i < 4; i++) {
    const icon = document.getElementById('phaseIcon' + i);
    const label = document.getElementById('phaseLabel' + i);
    if (!icon || !label) continue;

    const done = state.finished || (state.running && i < activePhase + 1);
    const active = state.running && i === activePhase;

    icon.className = 'phase-icon ' + (active ? 'active' : done ? 'done' : 'inactive');
    label.className = 'phase-label ' + (active ? 'active' : done ? 'done' : 'inactive');
    if (done && !active) label.textContent = '§a✓ ' + PHASES[i];
    else if (active) label.textContent = '§e⚡ ' + PHASES[i];
    else label.textContent = '§7○ ' + PHASES[i];
  }
}

function updateXpBar() {
  const maxLevel = 30;
  const fillPercent = Math.min((state.displayLevel / maxLevel) * 100, 100);
  const floored = Math.floor(state.displayLevel);
  
  document.getElementById('xpFill').style.width = fillPercent + '%';
  document.getElementById('xpFill').className = 'xp-fill' + (state.finished ? ' finished' : '');
  
  const num = document.getElementById('xpLevelNum');
  num.textContent = floored;
  num.className = 'xp-level-num' + (state.finished ? ' finished' : state.xpGlow ? ' glow' : state.running ? ' running' : '');
  
  document.getElementById('xpShine').style.display = (state.running && !state.finished) ? 'block' : 'none';
}

function addEvent(ev) {
  state.events.push(ev);
  const container = document.getElementById('terminalEvents');
  if (state.events.length === 1) container.innerHTML = '';
  
  const el = document.createElement('div');
  el.className = 'event-row event-anim';
  
  const iconCls = ev.type === 'thinking' ? 'thinking' : ev.type === 'tool_call' ? 'tool' : ev.type === 'todo' ? 'todo' : 'thinking';
  const icon = ev.type === 'thinking' ? '🧠' : ev.type === 'tool_call' ? '🔧' : ev.type === 'todo' ? '📋' : '💻';
  const label = ev.type === 'thinking' ? '思考' : ev.type === 'tool_call' ? '工具调用' : ev.type === 'todo' ? '待办' : '系统';
  
  let contentHtml = `<span class="event-type">${label}</span>`;
  if (ev.toolName) {
    contentHtml += `<div style="margin-top:2px;"><span class="event-toolname">${ev.toolName}</span>`;
    if (ev.args) contentHtml += ` <span style="color:#9ca3af;">· ${ev.args.slice(0,60)}</span>`;
    contentHtml += `</div>`;
  }
  if (ev.content && !ev.toolName) {
    contentHtml += `<div class="event-msg">${ev.content}</div>`;
  }
  
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.innerHTML = `
    <span class="event-icon ${iconCls}">${icon}</span>
    <div class="event-content">${contentHtml}</div>
    <span class="event-time">${time}</span>
  `;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
  document.getElementById('eventCount').textContent = state.events.length + ' 事件';
}

function updateStats() {
  const fc = state.finished ? Math.floor(12 + Math.random() * 8) : state.events.length > 5 ? Math.floor(state.events.length * 0.4) : 0;
  document.getElementById('fileStats').textContent = fc > 0 ? fc + ' 个文件 · ' + (fc * 24 + Math.random() * 10).toFixed(1) + ' KB' : '尚无文件';
}

// ============ Enchant Animation ============
function generateRunes() {
  const container = document.getElementById('enchantParticles');
  container.innerHTML = '';
  const runes = ['ᛃ','⚡','✦','◈','⏣','⬡','ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛊ','ᛏ','ᛒ'];
  const colors = ['#AA00FF','#00FFAA','#FFD700','#FF00FF','#00AAFF'];
  for (let i = 0; i < 50; i++) {
    const span = document.createElement('span');
    span.className = 'enchant-rune';
    span.textContent = runes[Math.floor(Math.random() * runes.length)];
    span.style.cssText = `
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      animation-delay:${Math.random()*2}s;
      font-size:${Math.random()*20+12}px;
      color:${colors[Math.floor(Math.random()*5)]};
      opacity:0.6;
    `;
    container.appendChild(span);
  }
}

function generateXpOrbs() {
  const container = document.getElementById('xpOrbs');
  container.innerHTML = '';
  const colors = ['#AA00FF','#00FF00','#FFD700','#FF00FF','#00FFAA','#AA00FF'];
  for (let i = 0; i < 12; i++) {
    const orb = document.createElement('div');
    orb.className = 'xp-orb';
    orb.style.cssText = `
      background:${colors[i%6]};
      box-shadow:0 0 12px ${colors[i%6]};
      animation-delay:${i*0.12}s;
    `;
    container.appendChild(orb);
  }
}

function setEnchantPhase(phase) {
  state.enchantPhase = phase;
  const overlay = document.getElementById('enchantOverlay');
  const container = document.getElementById('bookContainer');
  const book = document.getElementById('book');
  const bookInner = document.getElementById('bookInner');
  const bottomText = document.getElementById('bottomText');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');
  const ring3 = document.getElementById('ring3');
  const xpOrbs = document.getElementById('xpOrbs');
  
  container.className = 'book-container';
  overlay.classList.add('active');
  
  const showRings = phase === 'enchanting' || phase === 'enchanted';
  ring1.style.display = ring2.style.display = ring3.style.display = showRings ? 'block' : 'none';
  xpOrbs.style.display = showRings ? 'flex' : 'none';
  
  switch(phase) {
    case 'bookAppear':
      container.classList.add('appear');
      book.className = 'book';
      bookInner.innerHTML = `
        <span class="book-text">📖 需求之书</span>
        <div class="book-content-box" style="margin-top:8px;">
          <p class="book-content-text">${state.promptText || '请帮我生成一个Mod...'}</p>
        </div>
      `;
      bottomText.innerHTML = '<span style="color:#00FFAA;">§a* 翻开需求之书... *</span>';
      generateRunes(); // pre-gen but hidden
      break;
      
    case 'reading':
      book.className = 'book';
      bookInner.innerHTML = `
        <span class="book-text">📖 需求之书</span>
        <div class="book-content-box" style="margin-top:8px;">
          <p class="book-content-text">${state.promptText || '请帮我生成一个Mod...'}</p>
        </div>
      `;
      bottomText.innerHTML = '<span style="color:#00FFAA;">§7* 正在阅读提示词... *</span>';
      break;
      
    case 'flip':
      container.classList.add('flip');
      book.className = 'book';
      bookInner.innerHTML = `
        <span class="book-text">📜 翻页中...</span>
        <div class="book-content-box" style="margin-top:8px;">
          <p class="book-content-text">${state.promptText || '请帮我生成一个Mod...'}</p>
        </div>
      `;
      bottomText.innerHTML = '<span style="color:#00FFAA;">§e* 书页翻动中... *</span>';
      break;
      
    case 'enchanting':
      container.classList.add('enchanting');
      book.className = 'book';
      bookInner.innerHTML = `
        <span class="book-text">📖 需求之书</span>
        <div class="book-content-box" style="margin-top:8px;">
          <p class="book-content-text">${state.promptText || '请帮我生成一个Mod...'}</p>
        </div>
      `;
      bottomText.innerHTML = '<span style="color:#00FFAA;">§d✦ 奥术能量涌动中! ✦</span>';
      generateRunes();
      generateXpOrbs();
      break;
      
    case 'enchanted':
      container.className = 'book-container enchanted';
      book.className = 'book enchanted';
      const runes = ['ᛟ','ᚹ','ᛖ','ᚱ','ᚠ','ᚢ','ᛚ','ᛚ','ᛟ','ᚹ','ᛖ','ᚱ','ᚠ','ᚢ','ᛚ','ᛚ'];
      const rcolors = ['#AA00FF','#FF00FF','#FFD700','#00FFAA'];
      bookInner.innerHTML = `
        <div class="book-emoji" style="animation:enchGlow 0.8s ease-in-out infinite;">📚</div>
        <div style="animation:enchGlow 0.8s ease-in-out infinite;">
          <span class="book-title">附魔完成!</span>
        </div>
        <div class="rune-row">${runes.map((r,i) => `<span class="rune-char" style="color:${rcolors[i%4]};animation-delay:${i*0.05}s;text-shadow:0 0 6px currentColor;">${r}</span>`).join('')}</div>
      `;
      bottomText.className = 'bottom-text enchanted-text';
      bottomText.innerHTML = '§5✦ 附魔完成! Mod已生成! ✦';
      break;
      
    case 'done':
      overlay.classList.remove('active');
      break;
  }
  
  if (showRings) generateXpOrbs();
}

function triggerEnchant() {
  clearEnchantTimers();
  setEnchantPhase('bookAppear');
  
  const timers = [];
  timers.push(setTimeout(() => setEnchantPhase('reading'), 800));
  timers.push(setTimeout(() => setEnchantPhase('flip'), 1800));
  timers.push(setTimeout(() => {
    setEnchantPhase('enchanting');
    playEnchantSound(() => {
      setEnchantPhase('enchanted');
      timers.push(setTimeout(() => setEnchantPhase('done'), 2000));
    });
  }, 2600));
  
  state.enchantTimers = timers;
}

function clearEnchantTimers() {
  state.enchantTimers.forEach(t => clearTimeout(t));
  state.enchantTimers = [];
}

// ============ Simulation ============
let simTimer = null;
let simElapsed = 0;
let simSeconds = 0;
let eventCounter = 0;

const thinkingMessages = [
  '分析用户需求：需要生成一个新的Mod...',
  '正在理解Mod类型和功能需求...',
  '检查Forge/Fabric兼容性要求...',
  '规划Mod项目结构...',
  '确定需要注册的方块和物品...',
  '设计合成配方和掉落表...',
  '评估所需的事件监听器...',
  '考虑与其他Mod的兼容性...',
];

const toolCalls = [
  { name: 'write_file', arg: 'src/main/java/com/example/mod/ModMain.java · 主类文件' },
  { name: 'write_file', arg: 'src/main/java/com/example/mod/Config.java · 配置文件' },
  { name: 'write_file', arg: 'src/main/java/com/example/mod/items/ModItems.java · 物品注册' },
  { name: 'write_file', arg: 'src/main/java/com/example/mod/blocks/ModBlocks.java · 方块注册' },
  { name: 'write_file', arg: 'src/main/resources/assets/mod/lang/zh_cn.json · 中文翻译' },
  { name: 'write_file', arg: 'src/main/java/com/example/mod/events/ModEvents.java · 事件处理' },
  { name: 'write_file', arg: 'build.gradle · 构建配置' },
  { name: 'write_file', arg: 'src/main/resources/META-INF/mods.toml · Mod元数据' },
];

function toggleSimulation() {
  if (state.running) {
    stopSimulation();
    return;
  }
  startSimulation();
}

function startSimulation() {
  state.running = true;
  state.finished = false;
  state.events = [];
  state.displayLevel = 0;
  state.prevFloored = 0;
  state.enchantPhase = 'idle';
  simElapsed = 0;
  simSeconds = 0;
  eventCounter = 0;
  
  document.getElementById('terminalEvents').innerHTML = `
    <div style="text-align:center;padding:80px 20px;color:#52525b;font-size:13px;">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2s ease-in-out infinite;margin-right:8px;"></span>
      等待智能体输出...
    </div>
  `;
  document.getElementById('eventCount').textContent = '0 事件';
  document.getElementById('simBtn').textContent = '⏹ 停止模拟';
  document.getElementById('simBtn').classList.add('running');
  document.getElementById('simInfo').textContent = '模拟运行中...观察经验条增长';
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('statusVal').textContent = '生成中';
  document.getElementById('statusVal').style.color = '#55FF55';
  document.getElementById('xpFill').classList.remove('finished');
  updateXpBar();
  updatePhases(0);
  
  // Reset enchant overlay
  clearEnchantTimers();
  document.getElementById('enchantOverlay').classList.remove('active');
  
  // Sim tick
  simTimer = setInterval(simTick, 800);
}

function simTick() {
  simSeconds += 0.8;
  state.running = true;
  
  // Add event
  eventCounter++;
  if (eventCounter <= thinkingMessages.length) {
    addEvent({ type: 'thinking', content: thinkingMessages[eventCounter - 1] + ' [...]' });
  } else if (eventCounter <= thinkingMessages.length + toolCalls.length * 2) {
    const ti = Math.floor((eventCounter - thinkingMessages.length - 1) / 2);
    if (ti < toolCalls.length) {
      addEvent({ type: 'tool_call', toolName: toolCalls[ti].name, args: toolCalls[ti].arg });
    }
  } else if (eventCounter <= thinkingMessages.length + toolCalls.length * 2 + 3) {
    addEvent({ type: 'todo', content: '✅ 任务进度更新...' });
  }
  
  // Calc xp level
  const totalEvents = thinkingMessages.length + toolCalls.length * 2 + 3;
  const progress = Math.min(eventCounter / totalEvents, 0.95);
  const targetLevel = Math.floor(progress * 30 * 10) / 10;
  animateLevel(targetLevel);
  
  // Update time
  const m = Math.floor(simSeconds / 60);
  const s = Math.floor(simSeconds % 60);
  document.getElementById('timeVal').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  
  // Active phase
  let ap = 0;
  if (eventCounter > thinkingMessages.length) ap = 1;
  if (eventCounter > thinkingMessages.length + toolCalls.length) ap = 2;
  updatePhases(ap);
  updateStats();
  
  // Check completion
  if (progress >= 0.95) {
    finishSimulation();
  }
}

function finishSimulation() {
  stopSimTimer();
  state.running = false;
  state.finished = true;
  
  // Animate to level 30
  animateLevel(30);
  
  document.getElementById('simBtn').textContent = '▶ 模拟Agent运行';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '模拟完成！触发附魔动画中...';
  document.getElementById('dlBtn').disabled = false;
  document.getElementById('statusVal').textContent = '已完成';
  document.getElementById('statusVal').classList.add('finished');
  document.getElementById('xpFill').classList.add('finished');
  updatePhases(3);
  updateStats();
  
  // Trigger enchant animation
  setTimeout(() => triggerEnchant(), 500);
}

function stopSimulation() {
  stopSimTimer();
  clearEnchantTimers();
  state.running = false;
  document.getElementById('simBtn').textContent = '▶ 模拟Agent运行';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '模拟已停止';
}

function stopSimTimer() {
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
}

function resetAll() {
  stopSimulation();
  clearEnchantTimers();
  state.running = false;
  state.finished = false;
  state.events = [];
  state.displayLevel = 0;
  state.prevFloored = 0;
  state.xpGlow = false;
  state.enchantPhase = 'idle';
  simElapsed = 0;
  simSeconds = 0;
  eventCounter = 0;
  
  document.getElementById('enchantOverlay').classList.remove('active');
  document.getElementById('simBtn').textContent = '▶ 模拟Agent运行';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '点击按钮模拟Mod生成过程，观察经验条增长和附魔动画';
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('statusVal').textContent = '等待中';
  document.getElementById('statusVal').style.color = '#9ca3af';
  document.getElementById('statusVal').classList.remove('finished');
  document.getElementById('timeVal').textContent = '00:00';
  document.getElementById('fileStats').textContent = '尚无文件';
  
  updateXpBar();
  updatePhases(-1);
  
  document.getElementById('terminalEvents').innerHTML = `
    <div style="text-align:center;padding:80px 20px;color:#52525b;font-size:13px;">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2s ease-in-out infinite;margin-right:8px;"></span>
      等待智能体输出...
    </div>
  `;
  document.getElementById('eventCount').textContent = '0 事件';
}

// Level animation
let levelAnimFrame = null;
function animateLevel(target) {
  if (levelAnimFrame) cancelAnimationFrame(levelAnimFrame);
  
  const step = () => {
    const diff = target - state.displayLevel;
    if (Math.abs(diff) < 0.1) {
      state.displayLevel = target;
      updateXpBar();
      levelAnimFrame = null;
      return;
    }
    state.displayLevel += Math.sign(diff) * 0.35;
    state.displayLevel = Math.round(state.displayLevel * 10) / 10;
    updateXpBar();
    
    // Check level-up
    const floored = Math.floor(state.displayLevel);
    if (floored > state.prevFloored && floored > 0) {
      state.prevFloored = floored;
      state.xpGlow = true;
      // Flash effect
      const flash = document.getElementById('xpGlowFlash');
      flash.innerHTML = '<div class="xp-glow-flash"></div>';
      setTimeout(() => flash.innerHTML = '', 300);
      setTimeout(() => state.xpGlow = false, 300);
      // Pop text
      const pop = document.getElementById('xpLevelPop');
      document.getElementById('xpLevelPopText').textContent = floored + '级!';
      pop.style.display = 'block';
      setTimeout(() => pop.style.display = 'none', 1500);
      // Sound
      playLevelUpSound();
    }
    
    levelAnimFrame = requestAnimationFrame(step);
  };
  levelAnimFrame = requestAnimationFrame(step);
}

// ============ Init ============
function init() {
  // Voxel particles
  const voxelBg = document.getElementById('voxelBg');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'voxel-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    voxelBg.appendChild(p);
  }
  
  buildSegments();
  buildPhases();
  updateXpBar();
  
  // Load a sample prompt
  state.promptText = '请帮我生成一个Minecraft Mod，添加一把附魔的钻石剑和一套自定义护甲...';
}

init();
