<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Mod生成 v3 - 精确取色版</title>
<style>
/* ========== MC原版UI颜色（从图片精确提取） ==========
   经验条亮绿: #7EFC20 (R126 G252 B32)
   经验条中间: #4C9813
   经验条暗绿: #436924 / #223D22
   经验条暗底: #262846 (蓝灰深色)
   书棕色: #654B17 / #664C17
   附魔书紫色: #977AA8
*/
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0D0D0D;
  color: #BFBFBF;
  font-family: 'Courier New', 'Consolas', 'Microsoft YaHei', monospace;
  min-height: 100vh;
  image-rendering: pixelated;
}

.bg-canvas { position: fixed; inset: 0; z-index: 0; }
.app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px; }

/* ========== MC原版经验条（精确取色） ========== */
.xp-bar-section {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  border: 2px solid #373737;
}

.xp-label-row { display: flex; justify-content: space-between; align-items: center; }
.xp-label { font-size: 11px; color: #A0A0A0; text-shadow: 0 1px 0 rgba(0,0,0,0.9); }
.xp-level-display { display: flex; align-items: baseline; gap: 4px; }

/* MC经验等级数字 - 从图片取色的霓虹绿 */
.xp-lvl-num {
  font-size: 20px; font-weight: bold;
  color: #7EFC20;
  text-shadow: 0 2px 0 #000, 0 0 3px #3A7A0A;
  transition: color 0.3s;
}
.xp-lvl-num.finished {
  color: #7EFC20;
  text-shadow: 0 2px 0 #000, 0 0 10px rgba(126,252,32,0.8), 0 0 20px rgba(126,252,32,0.4);
}
.xp-lvl-max { font-size: 12px; color: #606060; }

/* MC经验条轨道 - 暗蓝灰底（图片实测 #262846） */
.xp-track {
  position: relative; height: 16px;
  background: #262846;
  border: 2px solid #1A1C33;
  overflow: hidden;
}

/* 背景条纹 - 每4px一条暗纹 */
.xp-track::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.35) 3px,
    rgba(0,0,0,0.35) 4px
  );
}

/* MC经验填充 - 使用图片提取的精确颜色 */
.xp-fill {
  position: relative; height: 100%;
  transition: width 0.5s ease-out;
  /* 垂直渐变：顶部亮绿 #7EFC20 → 中间 #4C9813 → 底部暗绿 #436924 */
  background: linear-gradient(
    180deg,
    #7EFC20 0%,      /* 顶部 - 最亮 */
    #7EFC20 18%,     
    #62C419 30%,     /* 过渡 */
    #4C9813 55%,     /* 中部 */
    #436924 80%,     /* 中下部 */
    #223D22 100%     /* 底部 - 最暗 */
  );
}
.xp-fill.finished {
  background: linear-gradient(
    180deg,
    #7EFC20 0%,
    #7EFC20 15%,
    #6FD81A 40%,
    #4C9813 65%,
    #3A7A0A 100%
  );
  box-shadow: 0 0 10px rgba(126,252,32,0.3);
}

/* 顶部高光 */
.xp-fill::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; 
  height: 3px; 
  background: rgba(255,255,255,0.18);
}

/* 闪光划过 */
.xp-shine {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, 
    transparent 0%, 
    rgba(255,255,255,0.08) 35%, 
    rgba(255,255,255,0.15) 50%,
    rgba(255,255,255,0.08) 65%,
    transparent 100%
  );
  animation: xpShine 2.5s ease-in-out infinite;
}
@keyframes xpShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(180%); }
}

/* 分段线 */
.xp-seg {
  position: absolute; top: 0; height: 100%;
  width: 1px; background: rgba(0,0,0,0.25);
}

/* 升级闪烁 */
.xp-flash {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.4);
  animation: flashOut 0.35s ease-out forwards;
}
@keyframes flashOut {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* 升级飘字 */
.lvl-pop {
  position: absolute; top: -28px; right: 0; pointer-events: none;
  animation: popUp 1.4s ease-out forwards;
}
.lvl-pop span {
  font-size: 12px; font-weight: bold;
  color: #7EFC20;
  text-shadow: 0 2px 0 #000, 0 0 8px rgba(126,252,32,0.8);
}
@keyframes popUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-18px); }
}

/* ========== 阶段指示器 ========== */
.phases { display: flex; gap: 6px; margin-top: 6px; }
.phase {
  flex: 1; text-align: center; 
  padding: 5px 3px;
  border: 2px solid #1A1C33;
  background: #262846;
  transition: all 0.3s;
}
.phase.active {
  border-color: #7EFC20;
  background: #1A2A10;
  box-shadow: 0 0 6px rgba(126,252,32,0.3);
}
.phase.done {
  border-color: #2A4A1A;
  background: #0F1F0A;
}
.phase-icon { font-size: 16px; display: block; }
.phase-label {
  font-size: 9px; font-weight: bold; margin-top: 2px; display: block;
  color: #606060;
}
.phase.active .phase-label { color: #7EFC20; }
.phase.done .phase-label { color: #4A8A2A; }

/* ========== 面板 ========== */
.mc-panel {
  background: rgba(0,0,0,0.75);
  border: 2px solid #373737;
}
.mc-panel-header {
  padding: 6px 10px;
  background: rgba(0,0,0,0.5);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 12px; font-weight: bold;
  color: #BFBFBF;
}
.mc-panel-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* MC原版按钮 */
.mc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px 14px; cursor: pointer;
  font-family: inherit; font-size: 11px; font-weight: bold;
  background: #C6C6C6; color: #3F3F3F;
  border: 2px solid #000;
  border-bottom: 3px solid #000;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  transition: 0.05s;
  image-rendering: pixelated;
}
.mc-btn:hover { background: #8B8B8B; }
.mc-btn:disabled { opacity: 0.4; cursor: default; }
.mc-btn-dark {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px 14px; cursor: pointer;
  font-family: inherit; font-size: 11px; font-weight: bold;
  background: #373737; color: #BFBFBF;
  border: 2px solid #000;
  border-bottom: 3px solid #000;
  text-shadow: 0 1px 0 rgba(0,0,0,0.8);
  transition: 0.05s;
}
.mc-btn-dark:hover { background: #4A4A4A; }

/* 卡片 */
.stat-card {
  padding: 6px 8px;
  background: #262846;
  border: 2px solid #1A1C33;
}
.stat-label { font-size: 9px; color: #808090; }
.stat-value { font-size: 14px; font-weight: bold; color: #7EFC20; margin-top: 2px; }

/* 终端 */
.terminal {
  background: #0D0D0D;
  border: 2px solid #373737;
  height: 500px;
  display: flex; flex-direction: column;
}
.terminal-header {
  padding: 5px 10px;
  background: rgba(0,0,0,0.5);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 8px;
}
.terminal-body {
  flex: 1; overflow-y: auto; padding: 6px;
  display: flex; flex-direction: column; gap: 3px;
  font-size: 11px;
}
.event {
  padding: 3px 5px; animation: evIn 0.25s ease;
}
@keyframes evIn { 0% { opacity:0; transform:translateY(3px); } 100% { opacity:1; transform:translateY(0); } }
.event-thinking { color: #F59E0B; }
.event-tool { color: #60A5FA; }
.event-ok { color: #34D399; }

/* ========== 附魔遮罩 ========== */
.ench-overlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.94);
}
.ench-overlay.on { display: flex; }
.ench-particles { position: absolute; inset: 0; overflow: hidden; }
.ench-rune {
  position: absolute; font-family: monospace;
  animation: rFloat 3.5s ease-in-out infinite;
}
@keyframes rFloat {
  0%,100% { transform: translateY(40px) rotate(0deg); opacity: 0; }
  20% { opacity: 0.7; }
  80% { opacity: 0.3; }
  100% { transform: translateY(-50px) rotate(360deg); opacity: 0; }
}

.book-stage {
  position: relative; width: 200px; height: 260px;
  perspective: 800px;
}

/* 旋转光环 */
.ring { position: absolute; border-radius: 50%; border: 2px dashed; animation: ringSpin linear infinite; }
.ring.r1 { inset: -28px; border-color: rgba(126,252,32,0.35); animation-duration: 4s; }
.ring.r2 { inset: -46px; border-color: rgba(151,122,168,0.3); animation-duration: 3s; animation-direction: reverse; }
.ring.r3 { inset: -64px; border-color: rgba(255,215,0,0.15); animation-duration: 5s; }
@keyframes ringSpin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

/* ========== MC原版书（取色自图片 #654B17） ========== */
.mc-book {
  width: 200px; height: 260px; position: relative;
  background: linear-gradient(135deg, #7A5C1E, #654B17, #4E380E);
  border: 3px solid #3A2508;
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.1),
    0 6px 24px rgba(0,0,0,0.7);
  transition: all 0.5s;
}
.book-spine {
  position: absolute; left: 0; top: 0; height: 100%; width: 18px;
  background: linear-gradient(90deg, #4E380E, #654B17);
  border-right: 2px solid #2A1800;
}
.book-cover-top, .book-cover-bottom {
  position: absolute; left: 18px; right: 4px; height: 1px;
  background: rgba(255,255,255,0.08);
}
.book-cover-top { top: 28px; }
.book-cover-bottom { bottom: 28px; }
.book-inner {
  position: absolute; left: 18px; right: 0; top: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 18px;
}

/* MC附魔书（取色自图片 #977AA8 紫色） */
.mc-book.enchanted {
  background: linear-gradient(135deg, #A88BC4, #977AA8, #6A4E7A);
  border-color: #5A3E6A;
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.1),
    0 0 30px rgba(151,122,168,0.6),
    0 0 80px rgba(151,122,168,0.2);
}

.ench-text {
  font-size: 20px; font-weight: bold;
  color: #A88BC4;
  text-shadow: 
    0 2px 0 #000,
    0 0 10px rgba(151,122,168,0.9),
    0 0 24px rgba(151,122,168,0.5);
  animation: eGlow 1s ease-in-out infinite;
}
@keyframes eGlow { 0%,100%{opacity:0.8;filter:brightness(1)} 50%{opacity:1;filter:brightness(1.3)} }
.rune-row { display: flex; gap: 3px; margin-top: 6px; }
.rune-char {
  font-size: 12px; color: #A88BC4;
  animation: eGlow 0.8s ease-in-out infinite;
}

/* 动画 */
@keyframes bkAppear { 0%{transform:scale(0.3) rotateY(90deg);opacity:0} 100%{transform:scale(1) rotateY(0);opacity:1} }
@keyframes bkFlip { 0%{transform:rotateY(0)} 50%{transform:rotateY(85deg)} 100%{transform:rotateY(0)} }
@keyframes bkSpin { 0%{transform:rotateY(0)} 50%{transform:rotateY(180deg) scale(1.04)} 100%{transform:rotateY(360deg) scale(1)} }
.a-appear { animation: bkAppear 0.55s ease-out; }
.a-flip { animation: bkFlip 0.7s ease-in-out; }
.a-enchanting { transform: scale(1.1); }
.a-enchanted { animation: bkSpin 0.9s ease-in-out; }

/* XP球 */
.xp-orbs {
  position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px;
}
.xp-orb {
  width: 7px; height: 7px; border-radius: 50%;
  animation: orbFloat 1.4s ease-out infinite;
}
@keyframes orbFloat {
  0% { transform: translateY(0) scale(0.4); opacity: 0; }
  25% { opacity: 1; transform: translateY(-6px) scale(1.2); }
  100% { transform: translateY(-36px) scale(0.2); opacity: 0; }
}

.bottom-tip {
  position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
  font-size: 14px; font-weight: bold; color: #7EFC20;
  text-shadow: 0 2px 0 #000, 0 0 8px rgba(126,252,32,0.6);
  text-align: center;
}

/* Grid */
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 750px) { .grid { grid-template-columns: 1fr; } }

.ctrl-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: #262846;
  border: 2px solid #1A1C33;
  margin-bottom: 14px;
}
.ctrl-btn {
  padding: 5px 14px; cursor: pointer;
  font-family: inherit; font-size: 11px; font-weight: bold;
  background: #7EFC20; color: #000;
  border: 2px solid #4A9810;
  text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  transition: 0.05s;
}
.ctrl-btn:hover { background: #8EFF30; }
.ctrl-btn.running { background: #FF5555; color: #fff; border-color: #AA0000; }
.ctrl-info { font-size: 10px; color: #808090; }
</style>
</head>
<body>

<canvas class="bg-canvas" id="bgC"></canvas>

<!-- 附魔遮罩 -->
<div class="ench-overlay" id="enchOv">
  <div class="ench-particles" id="enchP"></div>
  <div class="book-stage" id="bkStage">

<!-- 主UI -->

        <!-- 统计 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div class="stat-card">

          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">产物统计</div>

        </div>

          <button class="mc-btn" id="dlBtn" disabled onclick="alert('[模拟] 下载: mod.zip')">⬇ 下载mod</button>

          等待智能体输出...
        </div>
      </div>

<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}</style>

<script>
// ========== MC音效引擎（更接近原版） ==========

/** MC经验球音效 - 清脆的高音叮 */
function sndOrb() {
  try {
    const C = new (window.AudioContext||window.webkitAudioContext)(), t = C.currentTime;
    // MC orb: 1200Hz + 1800Hz 三角波
    [1300, 1900].forEach((f,i) => {
      const o=C.createOscillator(), g=C.createGain();
      o.type='triangle'; 
      o.frequency.setValueAtTime(f, t+i*0.07);
      g.gain.setValueAtTime(0.18, t+i*0.07);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.07+0.18);
      o.connect(g);g.connect(C.destination);
      o.start(t+i*0.07);o.stop(t+i*0.07+0.18);
    });
    setTimeout(()=>C.close(),600);
  } catch(_){}
}

/**
 * MC附魔音效模拟 - 参考原版Enchantment Table声音
 * 原版特征：低频嗡鸣(rumbling) + 升调(pitch up) + 和弦爆发
 * 这里用多层合成尽可能接近
 */
function sndEnchant(cb) {
  try {
    const C = new (window.AudioContext||window.webkitAudioContext)(), t = C.currentTime;
    
    // Layer 1: 低沉嗡鸣 (类似附魔台嗡嗡声，30-80Hz)
    [40,60,80].forEach((f,i) => {
      const o=C.createOscillator(), g=C.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f, t+i*0.05);
      o.frequency.linearRampToValueAtTime(f*0.3, t+2.5);
      g.gain.setValueAtTime(0.06, t+i*0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t+2.8);
      o.connect(g);g.connect(C.destination);
      o.start(t+i*0.05);o.stop(t+2.8);
    });
    
    // Layer 2: 虚幻升调 (类似附魔符文亮起的声音)
    const notes=[160,240,320,450,580,750,950,1180,1420,1700];
    notes.forEach((f,i)=>{
      const o=C.createOscillator(), g=C.createGain();
      o.type=i%2?'triangle':'sine';
      o.frequency.setValueAtTime(f, t+0.8+i*0.13);
      o.frequency.exponentialRampToValueAtTime(f*1.1, t+0.8+i*0.13+0.4);
      g.gain.setValueAtTime(0.09, t+0.8+i*0.13);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.8+i*0.13+0.45);
      o.connect(g);g.connect(C.destination);
      o.start(t+0.8+i*0.13);o.stop(t+0.8+i*0.13+0.45);
    });
    
    // Layer 3: 爆发和弦 (附魔完成)
    [100,200,300,500,700,1000].forEach((f,i)=>{
      const o=C.createOscillator(), g=C.createGain();
      o.type=i<3?'square':'sine';
      o.frequency.setValueAtTime(f*2, t+2.2+i*0.03);
      o.frequency.exponentialRampToValueAtTime(f, t+3.0);
      g.gain.setValueAtTime(0.1, t+2.2+i*0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t+3.0);
      o.connect(g);g.connect(C.destination);
      o.start(t+2.2+i*0.03);o.stop(t+3.0);
    });
    
    setTimeout(()=>{C.close();if(cb)cb();},3200);
  } catch(_){if(cb)cb();}
}

// ========== 全局状态 ==========
const S={
  running:false,finished:false,dispLvl:0,prevFl:0,
  enchPhase:'idle',enchT:[],events:[],
  prompt:'请帮我生成一个Minecraft Mod，添加一把附魔钻石剑和自定义护甲套装...'
};

const PHASES=['思考','执行','生成','附魔完成!'];
const ICONS=['📖','⛏️','🔧','📚'];

// ========== UI初始化 ==========
function buildSegs(){
  const s=document.getElementById('xpSegs');s.innerHTML='';
  for(let i=1;i<30;i++){
    const d=document.createElement('div');
    d.className='xp-seg';d.style.left=(i/30*100)+'%';
    s.appendChild(d);
  }
}
function buildPhases(){
  const p=document.getElementById('phases');p.innerHTML='';
  PHASES.forEach((l,i)=>{
    const d=document.createElement('div');d.className='phase';
    d.innerHTML=`<span class="phase-icon" id="pi${i}">${ICONS[i]}</span><span class="phase-label" id="pl${i}">○ ${l}</span>`;
    p.appendChild(d);
  });
}
function updPhases(ap){
  for(let i=0;i<4;i++){
    const pi=document.getElementById('pi'+i),pl=document.getElementById('pl'+i);
    if(!pi||!pl)continue;
    const done=S.finished||(S.running&&i<=ap);
    const act=S.running&&i===ap;
    pi.parentElement.className='phase'+(act?' active':done?' done':'');
    pl.textContent=(act?'⚡ ':done?'✓ ':'○ ')+PHASES[i];
  }
}
function updXp(){
  const p=Math.min((S.dispLvl/30)*100,100);
  const f=Math.floor(S.dispLvl);
  document.getElementById('xpFill').style.width=p+'%';
  document.getElementById('xpFill').className='xp-fill'+(S.finished?' finished':'');
  const n=document.getElementById('xpNum');
  n.textContent=f;n.className='xp-lvl-num'+(S.finished?' finished':'');
  document.getElementById('xpSh').style.display=(S.running&&!S.finished)?'block':'none';
}
function addEv(type,content,tn,args){
  S.events.push({type,content,tn,args});
  const b=document.getElementById('termB');
  if(S.events.length===1)b.innerHTML='';
  const el=document.createElement('div');el.className='event';
  let h='';
  if(type==='thinking')h=`<span class="event-thinking">🧠 思考</span> · ${content}`;
  else if(type==='tool_call')h=`<span class="event-tool">🔧 工具调用</span> · <span style="color:#22D3EE;">${tn}</span> ${args?'· '+args.slice(0,45):''}`;
  else if(type==='done')h=`<span class="event-ok">✅ ${content}</span>`;
  el.innerHTML=h;b.appendChild(el);b.scrollTop=b.scrollHeight;
  document.getElementById('evCnt').textContent=S.events.length+' 事件';
}
function updStats(){
  const fc=S.finished?12+Math.floor(Math.random()*8):S.events.length>5?Math.floor(S.events.length*0.4):0;
  document.getElementById('fsVal').textContent=fc>0?fc+' 个文件 · '+(fc*24+Math.random()*10).toFixed(1)+' KB':'尚无文件';
}

// ========== 附魔动画 ==========
function genRunes(){
  const c=document.getElementById('enchP');c.innerHTML='';
  const runes='ᛃ⚡✦ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛊᛏᛒ◈⏣⬡'.split('');
  const cols=['#A88BC4','#7EFC20','#FFD700','#60A5FA','#F472B6'];
  for(let i=0;i<65;i++){
    const s=document.createElement('span');s.className='ench-rune';
    s.textContent=runes[Math.floor(Math.random()*runes.length)];
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;font-size:${Math.random()*24+10}px;color:${cols[Math.floor(Math.random()*5)]};`;
    c.appendChild(s);
  }
}
function genOrbs(){
  const c=document.getElementById('orbs');c.innerHTML='';
  const cols=['#A88BC4','#7EFC20','#FFD700','#F472B6','#60A5FA'];
  for(let i=0;i<14;i++){
    const d=document.createElement('div');d.className='xp-orb';
    d.style.cssText=`background:${cols[i%5]};box-shadow:0 0 8px ${cols[i%5]};animation-delay:${i*0.08}s;`;
    c.appendChild(d);
  }
}
function setEP(phase){
  S.enchPhase=phase;
  const ov=document.getElementById('enchOv'),st=document.getElementById('bkStage');
  const bk=document.getElementById('book'),inr=document.getElementById('bkInner');
  const tip=document.getElementById('tip');
  const r1=document.getElementById('r1'),r2=document.getElementById('r2'),r3=document.getElementById('r3');
  const orbs=document.getElementById('orbs');
  
  st.className='book-stage';ov.classList.add('on');
  const sR=phase==='enchanting'||phase==='enchanted';
  r1.style.display=r2.style.display=r3.style.display=sR?'block':'none';
  orbs.style.display=sR?'flex':'none';
  
  switch(phase){
    case'appear':
      st.classList.add('a-appear');bk.className='mc-book';
      inr.innerHTML=`
        <span style="font-size:14px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📖 需求之书</span>
        <div style="margin-top:8px;padding:6px 8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);max-width:150px;">
          <p style="font-size:9px;color:#BCAAA4;line-height:1.3;max-height:50px;overflow:hidden;">${S.prompt}</p>
        </div>
      `;
      tip.innerHTML='§a* 翻开需求之书... *';
      break;
    case'flip':
      st.classList.add('a-flip');bk.className='mc-book';
      inr.innerHTML=`
        <span style="font-size:14px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📜 翻页中...</span>
        <div style="margin-top:10px;font-size:28px;opacity:0.25;">📄</div>
      `;
      tip.innerHTML='§e* 书页翻动中... *';
      break;
    case'enchanting':
      st.classList.add('a-enchanting');bk.className='mc-book';
      inr.innerHTML=`
        <span style="font-size:14px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📖 需求之书</span>
        <div style="margin-top:8px;padding:6px 8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);max-width:150px;">
          <p style="font-size:9px;color:#BCAAA4;line-height:1.3;max-height:50px;overflow:hidden;">${S.prompt}</p>
        </div>
      `;
      tip.innerHTML='§d✦ 奥术能量涌动！✦';
      genRunes();genOrbs();
      break;
    case'enchanted':
      st.className='book-stage a-enchanted';bk.className='mc-book enchanted';
      const runes='ᛟᚹᛖᚱᚠᚢᛚᛚᛟᚹᛖᚱᚠᚢᛚᛚ'.split('');
      inr.innerHTML=`
        <span style="font-size:30px;">📚</span>
        <div style="margin-top:6px;"><span class="ench-text">附魔完成!</span></div>
        <div class="rune-row">${runes.map((r,i)=>`<span class="rune-char" style="animation-delay:${i*0.05}s;">${r}</span>`).join('')}</div>
      `;
      tip.innerHTML='§5✦ Mod已附魔成功！✦';
      break;
    case'done':ov.classList.remove('on');break;
  }
}
function trigEnch(){
  clrET();setEP('appear');
  const t=[];
  t.push(setTimeout(()=>setEP('flip'),750));
  t.push(setTimeout(()=>{setEP('enchanting');sndEnchant(()=>{setEP('enchanted');t.push(setTimeout(()=>setEP('done'),2000));});},1650));
  S.enchT=t;
}
function clrET(){S.enchT.forEach(clearTimeout);S.enchT=[];}

// ========== 模拟 ==========
let si=null,simSec=0,evCtr=0;
const tMsgs=[
  '分析用户需求：需要生成一个新的Minecraft Mod...',
  '正在解析Mod类型和功能需求...',
  '检查Forge / NeoForge兼容性要求...',
  '规划Mod项目目录结构...',
  '确定需要注册的方块和物品...',
  '设计合成配方和掉落表...',
  '评估所需事件监听器...',
  '考虑与其他模组的兼容性...',
];
const tls=[
  ['write_file','Main.java'],
  ['write_file','Config.java'],
  ['write_file','ModItems.java'],
  ['write_file','ModBlocks.java'],
  ['write_file','zh_cn.json'],
  ['write_file','ModEvents.java'],
  ['write_file','build.gradle'],
  ['write_file','mods.toml'],
];
const TOT=tMsgs.length+tls.length*2+3;

function toggle(){S.running?stop():start();}
function start(){
  S.running=true;S.finished=false;S.events=[];S.dispLvl=0;S.prevFl=0;S.enchPhase='idle';
  simSec=0;evCtr=0;
  document.getElementById('termB').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#525252;gap:6px;"><span style="width:5px;height:5px;background:#7EFC20;border-radius:50%;animation:blink 1.5s infinite;"></span>等待智能体输出...</div>`;
  document.getElementById('evCnt').textContent='0 事件';
  document.getElementById('simBtn').textContent='⏹ 停止';
  document.getElementById('simBtn').classList.add('running');
  document.getElementById('simInfo').textContent='模拟运行中...';
  document.getElementById('dlBtn').disabled=true;
  document.getElementById('stVal').textContent='生成中';
  document.getElementById('xpFill').classList.remove('finished');
  document.getElementById('enchOv').classList.remove('on');
  clrET();updXp();updPhases(0);
  si=setInterval(tick,800);
}
function tick(){
  simSec+=0.8;evCtr++;
  if(evCtr<=tMsgs.length)addEv('thinking',tMsgs[evCtr-1]+' [...]');
  else if(evCtr<=tMsgs.length+tls.length*2){const ti=Math.floor((evCtr-tMsgs.length-1)/2);if(ti<tls.length)addEv('tool_call','',tls[ti][0],tls[ti][1]);}
  else if(evCtr<=TOT)addEv('done','任务进度更新...');
  const prog=Math.min(evCtr/TOT,0.96);
  const target=Math.min(prog*30,29.5);
  animLvl(target);
  const m=Math.floor(simSec/60),s=Math.floor(simSec%60);
  document.getElementById('tmVal').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  let ap=0;if(evCtr>tMsgs.length)ap=1;if(evCtr>tMsgs.length+tls.length)ap=2;
  updPhases(ap);updStats();
  if(prog>=0.96)finish();
}
function finish(){
  clearInterval(si);si=null;S.running=false;S.finished=true;
  animLvl(30);
  document.getElementById('simBtn').textContent='▶ 模拟Mod生成';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent='完成！触发附魔动画...';
  document.getElementById('dlBtn').disabled=false;
  document.getElementById('stVal').textContent='已完成';
  document.getElementById('xpFill').classList.add('finished');
  updPhases(3);updStats();
  setTimeout(()=>trigEnch(),500);
}
function stop(){clearInterval(si);si=null;clrET();S.running=false;document.getElementById('simBtn').textContent='▶ 模拟Mod生成';document.getElementById('simBtn').classList.remove('running');document.getElementById('simInfo').textContent='已停止';document.getElementById('enchOv').classList.remove('on');}
function resetAll(){
  stop();clrET();S.running=false;S.finished=false;S.events=[];S.dispLvl=0;S.prevFl=0;S.enchPhase='idle';
  simSec=0;evCtr=0;
  document.getElementById('enchOv').classList.remove('on');
  document.getElementById('simBtn').textContent='▶ 模拟Mod生成';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent='点击按钮观看完整动画流程（经验条→附魔书）';
  document.getElementById('dlBtn').disabled=true;
  document.getElementById('stVal').textContent='等待中';
  document.getElementById('tmVal').textContent='00:00';
  document.getElementById('fsVal').textContent='尚无文件';
  document.getElementById('xpFill').classList.remove('finished');
  updXp();updPhases(-1);
  document.getElementById('termB').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#525252;gap:6px;"><span style="width:5px;height:5px;background:#7EFC20;border-radius:50%;animation:blink 1.5s infinite;"></span>等待智能体输出...</div>`;
  document.getElementById('evCnt').textContent='0 事件';
}

// ========== 等级动画 ==========
let laf=null;
function animLvl(target){
  if(laf)cancelAnimationFrame(laf);
  const step=()=>{
    const d=target-S.dispLvl;
    if(Math.abs(d)<0.08){S.dispLvl=target;updXp();laf=null;return;}
    S.dispLvl+=Math.sign(d)*0.35;S.dispLvl=Math.round(S.dispLvl*10)/10;updXp();
    const fl=Math.floor(S.dispLvl);
    if(fl>S.prevFl&&fl>0){
      S.prevFl=fl;
      const flash=document.getElementById('xpFlash');
      flash.innerHTML='<div class="xp-flash"></div>';
      setTimeout(()=>flash.innerHTML='',350);
      const pop=document.getElementById('lvlPop');
      document.getElementById('lvlPopTxt').textContent=fl+'级!';
      pop.style.display='block';
      setTimeout(()=>pop.style.display='none',1400);
      sndOrb();
    }
    laf=requestAnimationFrame(step);
  };
  laf=requestAnimationFrame(step);
}

// ========== 粒子背景 ==========
function initBg(){
  const C=document.getElementById('bgC'),ctx=C.getContext('2d');
  function rs(){C.width=innerWidth;C.height=innerHeight;}rs();addEventListener('resize',rs);
  const ps=[];for(let i=0;i<50;i++)ps.push({x:Math.random()*C.width,y:Math.random()*C.height,vx:(Math.random()-.5)*.25,vy:-(Math.random()*.35+.08),s:Math.random()*2+1,l:Math.random()*300+100});
  function dr(){
    ctx.clearRect(0,0,C.width,C.height);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.l--;
      if(p.l<0||p.y<-10){p.x=Math.random()*C.width;p.y=C.height+10;p.l=Math.random()*300+100;}
      const a=Math.min(p.l/100,0.35);
      ctx.fillStyle=`rgba(126,252,32,${a})`;
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.s,p.s);
    });
    requestAnimationFrame(dr);
  }
  dr();
}

buildSegs();buildPhases();updXp();updPhases(-1);initBg();
</script>
