<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Mod生成 v2 - 原版风格UI</title>
<style>
/* ========== Minecraft原版风格 - 完全复刻 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0D0D0D;
  color: #BFBFBF;
  font-family: 'Courier New', 'Consolas', 'Microsoft YaHei', monospace;
  min-height: 100vh;
  image-rendering: pixelated;
}

/* 背景粒子 - 类似MC主菜单 */
.bg-canvas { position: fixed; inset: 0; z-index: 0; }
.app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px; }

/* ========== MC原版经验条 ========== 
   MC经验条规格:
   - 背景: 黑色半透明，带暗色纹路
   - 填充: 亮绿色渐变 #55FF55 → #80FF00
   - 满级: #00FF00 + 发光效果
   - 分段: 每级一个细微分段线
   - 宽度随等级从0到30变化
*/
.xp-bar-section {
  display: flex; flex-direction: column; gap: 6px;
  padding: 12px;
  background: rgba(0,0,0,0.5);
  border: 2px solid #2D2D2D;
  border-image: repeating-linear-gradient(180deg, #373737, #1a1a1a 50%, #373737) 2;
}

.xp-label-row {
  display: flex; justify-content: space-between; align-items: center;
}
.xp-label {
  font-size: 11px; color: #898989; letter-spacing: 1px;
  text-shadow: 0 1px 0 rgba(0,0,0,0.8);
}
.xp-level-display {
  display: flex; align-items: baseline; gap: 4px;
}

/* MC原版等级数字 - 绿色粗体带阴影 */
.xp-level-num {
  font-size: 20px; font-weight: bold;
  color: #55FF55;
  text-shadow: 0 2px 0 #000, 0 0 2px #00AA00;
  transition: color 0.3s, text-shadow 0.3s;
}
.xp-level-num.finished {
  color: #00FF00;
  text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,255,0,0.8), 0 0 16px rgba(0,255,0,0.4);
}
.xp-level-num.glow {
  color: #80FF00;
  text-shadow: 0 2px 0 #000, 0 0 6px rgba(128,255,0,0.7);
}
.xp-level-max {
  font-size: 12px; color: #525252;
  text-shadow: 0 1px 0 rgba(0,0,0,0.8);
}

/* MC经验条轨道 - 黑色，像素边框 */
.xp-track {
  position: relative; height: 16px;
  background: #0D0D0D;
  border: 2px solid #2A2A2A;
  overflow: hidden;
  image-rendering: pixelated;
}

/* 背景条纹纹理 */
.xp-track::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.3) 3px,
    rgba(0,0,0,0.3) 4px
  );
}

/* MC经验条填充 - 明亮的绿色 */
.xp-fill {
  position: relative; height: 100%;
  transition: width 0.5s ease-out;
  background: linear-gradient(
    180deg,
    #3CB043 0%,
    #55FF55 30%,
    #50C878 50%,
    #3CB043 100%
  );
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
}
.xp-fill.finished {
  background: linear-gradient(
    180deg,
    #00FF00 0%,
    #33FF33 30%,
    #22DD22 50%,
    #00CC00 100%
  );
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,0.2),
    0 0 12px rgba(0,255,0,0.3);
}

/* 高光条纹 */
.xp-fill::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: rgba(255,255,255,0.2);
}

/* 经验条闪光动画 */
.xp-shine {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, 
    transparent 0%, 
    rgba(255,255,255,0.15) 30%, 
    rgba(255,255,255,0.25) 50%,
    rgba(255,255,255,0.15) 70%,
    transparent 100%
  );
  animation: xpShineAnim 2s ease-in-out infinite;
}
@keyframes xpShineAnim {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(150%); }
}

/* 分段标记线 */
.xp-segments {
  position: absolute; inset: 0;
}
.xp-seg {
  position: absolute; top: 0; height: 100%;
  width: 1px; background: rgba(0,0,0,0.2);
}

/* 升级闪烁覆盖层 */
.xp-glow-flash {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.35);
  animation: lvlFlash 0.35s ease-out forwards;
}
@keyframes lvlFlash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* 升级飘字 "X级!" */
.levelup-pop {
  position: absolute; top: -30px; right: 0; pointer-events: none;
  animation: popAnim 1.5s ease-out forwards;
}
.levelup-pop span {
  font-size: 12px; font-weight: bold;
  color: #80FF00;
  text-shadow: 0 2px 0 #000, 0 0 8px rgba(128,255,0,0.8);
}
@keyframes popAnim {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-20px); }
}

/* ========== MC阶段指示器 ========== */
.phases { display: flex; gap: 8px; margin-top: 8px; }
.phase {
  flex: 1; text-align: center; 
  padding: 6px 4px;
  border: 2px solid #1a1a1a;
  background: rgba(0,0,0,0.4);
  transition: all 0.3s;
  image-rendering: pixelated;
}
.phase.active {
  border-color: #55FF55;
  background: rgba(0,60,0,0.3);
  box-shadow: 0 0 8px rgba(85,255,85,0.3);
}
.phase.done {
  border-color: #2a5a2a;
  background: rgba(0,40,0,0.2);
}
.phase-icon { font-size: 18px; display: block; }
.phase-label {
  font-size: 9px; font-weight: bold; margin-top: 2px; display: block;
  color: #525252;
}
.phase.active .phase-label { color: #55FF55; }
.phase.done .phase-label { color: #3a7a3a; }

/* ========== MC面板风格 ========== */
.mc-panel {
  background: rgba(0,0,0,0.7);
  border: 2px solid #2D2D2D;
  border-image: repeating-linear-gradient(180deg, #373737, #1a1a1a 50%, #373737) 2;
}
.mc-panel-header {
  padding: 6px 12px;
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px; font-weight: bold;
  color: #BFBFBF;
}
.mc-panel-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* MC灰色按钮 */
.mc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: bold;
  background: #C6C6C6;
  color: #3F3F3F;
  border: 2px solid #373737;
  border-image: repeating-linear-gradient(180deg, #C6C6C6, #8B8B8B 50%, #555555) 2;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  transition: all 0.1s;
  image-rendering: pixelated;
}
.mc-btn:hover { 
  background: #8B8B8B; 
  border-image: repeating-linear-gradient(180deg, #B0B0B0, #717171 50%, #3F3F3F) 2;
}
.mc-btn.danger { background: #FF5555; color: #fff; }
.mc-btn:disabled { opacity: 0.5; cursor: default; }

/* MC深色按钮 */
.mc-btn-dark {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: bold;
  background: #373737;
  color: #BFBFBF;
  border: 2px solid #1A1A1A;
  text-shadow: 0 1px 0 rgba(0,0,0,0.8);
  transition: all 0.1s;
}
.mc-btn-dark:hover { background: #4A4A4A; }

/* ========== MC信息卡片 ========== */
.stat-card {
  padding: 8px 10px;
  background: rgba(0,0,0,0.4);
  border: 2px solid #2D2D2D;
  image-rendering: pixelated;
}
.stat-label { font-size: 9px; color: #898989; }
.stat-value { font-size: 15px; font-weight: bold; color: #55FF55; margin-top: 2px; }

/* ========== 终端 ========== */
.terminal {
  background: #0D0D0D;
  border: 2px solid #2D2D2D;
  border-image: repeating-linear-gradient(180deg, #373737, #1a1a1a 50%, #373737) 2;
  height: 520px;
  display: flex; flex-direction: column;
}
.terminal-header {
  padding: 6px 12px;
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 8px;
}
.terminal-body {
  flex: 1; overflow-y: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.event-line {
  padding: 4px 6px; 
  border-radius: 2px;
  font-size: 11px; 
  line-height: 1.4;
  animation: eventIn 0.3s ease;
}
@keyframes eventIn {
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: translateY(0); }
}
.event-line:hover { background: rgba(255,255,255,0.02); }
.event-thinking { color: #F59E0B; }
.event-tool { color: #60A5FA; }
.event-done { color: #34D399; }

/* ========== MC附魔动画遮罩 ========== */
.enchant-overlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.92);
}
.enchant-overlay.active { display: flex; }

/* 银河粒子 */
.enchant-particles { position: absolute; inset: 0; overflow: hidden; }
.enchant-rune {
  position: absolute; font-family: monospace;
  animation: runeFloat 3s ease-in-out infinite;
}
@keyframes runeFloat {
  0% { transform: translateY(30px) rotate(0deg); opacity: 0; }
  25% { opacity: 0.8; }
  75% { opacity: 0.4; }
  100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
}

/* 附魔书容器 */
.book-stage {
  position: relative;
  width: 200px; height: 260px;
  perspective: 600px;
}

/* 旋转光环 */
.orbit-ring {
  position: absolute; border-radius: 50%;
  border: 2px dashed;
  animation: orbitSpin linear infinite;
}
.orbit-ring.r1 { inset: -30px; border-color: rgba(0,255,170,0.4); animation-duration: 4s; }
.orbit-ring.r2 { inset: -50px; border-color: rgba(170,0,255,0.25); animation-duration: 3s; animation-direction: reverse; }
.orbit-ring.r3 { inset: -70px; border-color: rgba(255,215,0,0.15); animation-duration: 5s; }
@keyframes orbitSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ========== MC原版书 ========== */
.mc-book {
  width: 200px; height: 260px;
  position: relative;
  background: linear-gradient(135deg, #8B6914, #6B4F10);
  border: 3px solid #4A3508;
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.1),
    0 4px 20px rgba(0,0,0,0.6);
  image-rendering: pixelated;
  transition: all 0.5s;
}

/* MC书脊 */
.book-spine {
  position: absolute; left: 0; top: 0; height: 100%; width: 20px;
  background: linear-gradient(90deg, #5D3A1A, #8B6914);
  border-right: 2px solid #3A2000;
}

/* 书封面装饰 */
.book-cover-top {
  position: absolute; top: 30px; left: 20px; right: 20px;
  height: 1px; background: rgba(255,255,255,0.1);
}
.book-cover-bottom {
  position: absolute; bottom: 30px; left: 20px; right: 20px;
  height: 1px; background: rgba(255,255,255,0.1);
}

/* 书内页 */
.book-inner {
  position: absolute; left: 20px; right: 0; top: 0; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px;
}

/* MC原版附魔书 */
.mc-book.enchanted {
  background: linear-gradient(135deg, #4A0080, #2D0050);
  border-color: #7B00D4;
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.1),
    0 0 40px rgba(170,0,255,0.6),
    0 0 100px rgba(170,0,255,0.2);
}

/* 附魔发光文字 */
.ench-text {
  font-size: 20px; font-weight: bold;
  color: #FF55FF;
  text-shadow: 
    0 2px 0 #000,
    0 0 10px rgba(255,0,255,0.8),
    0 0 30px rgba(170,0,255,0.6);
  animation: enchPulse 1s ease-in-out infinite;
}
@keyframes enchPulse {
  0%, 100% { opacity: 0.8; filter: brightness(1); }
  50% { opacity: 1; filter: brightness(1.3); }
}

/* 附魔符文行 */
.rune-row { display: flex; gap: 3px; margin-top: 8px; }
.rune-char {
  font-size: 12px; color: #FF55FF;
  animation: enchPulse 0.8s ease-in-out infinite;
}

/* 书页动画 */
@keyframes bookAppear {
  0% { transform: scale(0.3) rotateY(90deg); opacity: 0; }
  100% { transform: scale(1) rotateY(0deg); opacity: 1; }
}
@keyframes bookFlip {
  0% { transform: rotateY(0deg); }
  50% { transform: rotateY(85deg); }
  100% { transform: rotateY(0deg); }
}
@keyframes bookSpin {
  0% { transform: rotateY(0deg); }
  50% { transform: rotateY(180deg) scale(1.05); }
  100% { transform: rotateY(360deg) scale(1); }
}
.anim-appear { animation: bookAppear 0.6s ease-out; }
.anim-flip { animation: bookFlip 0.8s ease-in-out; }
.anim-enchanting { transform: scale(1.1); }
.anim-enchanted { animation: bookSpin 1s ease-in-out; }

/* XP粒子 */
.xp-orbs {
  position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.xp-orb {
  width: 8px; height: 8px; border-radius: 50%;
  animation: orbUp 1.5s ease-out infinite;
  image-rendering: pixelated;
}
@keyframes orbUp {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { opacity: 1; transform: translateY(-8px) scale(1.2); }
  100% { transform: translateY(-40px) scale(0.2); opacity: 0; }
}

/* 底部提示 */
.bottom-hint {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
  font-size: 14px; font-weight: bold; color: #55FF55;
  text-shadow: 0 2px 0 #000, 0 0 8px rgba(85,255,85,0.6);
  text-align: center;
}

/* ========== Grid ========== */
.main-grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 750px) { .main-grid { grid-template-columns: 1fr; } }

/* 控制栏 */
.ctrl-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.5);
  border: 2px solid #2D2D2D;
  margin-bottom: 16px;
}
.ctrl-btn {
  padding: 6px 16px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: bold;
  background: #55FF55; color: #000;
  border: 2px solid #00AA00;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  image-rendering: pixelated;
  transition: all 0.1s;
}
.ctrl-btn:hover { background: #80FF00; }
.ctrl-btn.running { background: #FF5555; color: #fff; border-color: #AA0000; }
.ctrl-info { font-size: 11px; color: #898989; }
</style>
</head>
<body>

<!-- 背景 -->
<canvas class="bg-canvas" id="bgCanvas"></canvas>

<!-- 附魔遮罩 -->
<div class="enchant-overlay" id="enchantOverlay">
  <div class="enchant-particles" id="enchantParticles"></div>
  
  <div class="book-stage" id="bookStage">
    <div class="orbit-ring r1" id="or1" style="display:none"></div>
    <div class="orbit-ring r2" id="or2" style="display:none"></div>
    <div class="orbit-ring r3" id="or3" style="display:none"></div>
    
    <div class="mc-book" id="book">
      <div class="book-spine"></div>
      <div class="book-cover-top"></div>
      <div class="book-cover-bottom"></div>
      <div class="book-inner" id="bookInner"></div>
    </div>
    
    <div class="xp-orbs" id="xpOrbs" style="display:none"></div>
  </div>
  
  <div class="bottom-hint" id="bottomHint"></div>
</div>

<!-- 主界面 -->
<div class="app">
  <div class="ctrl-bar">
    <button class="ctrl-btn" id="simBtn" onclick="toggleSim()">▶ 模拟Mod生成</button>
    <span class="ctrl-info" id="simInfo">点击按钮观察完整动画流程</span>
  </div>

  <div class="main-grid">
    <!-- 左面板 -->
    <div class="mc-panel">
      <div class="mc-panel-header">
        生成状态
        <span style="margin-left:auto;font-size:10px;color:#898989;">minecraft</span>
      </div>
      <div class="mc-panel-body">
        <!-- 经验条 -->
        <div class="xp-bar-section">
          <div class="xp-label-row">
            <span class="xp-label">经验值</span>
            <div class="xp-level-display">
              <span class="xp-level-num" id="xpNum">0</span>
              <span class="xp-level-max">/ 30</span>
            </div>
          </div>
          <div class="xp-track" id="xpTrack">
            <div class="xp-fill" id="xpFill" style="width:0%">
              <div class="xp-shine" id="xpShine"></div>
              <div class="xp-segments" id="xpSegs"></div>
            </div>
            <div id="xpFlash"></div>
          </div>
          <div class="levelup-pop" id="lvlPop" style="display:none"><span id="lvlPopText"></span></div>
        </div>

        <!-- 阶段 -->
        <div class="phases" id="phases"></div>

        <!-- 状态卡片 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div class="stat-card">
            <div class="stat-label">状态</div>
            <div class="stat-value" id="statusVal">等待中</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已用时间</div>
            <div class="stat-value" id="timeVal">00:00</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">产物统计</div>
          <div style="font-size:12px;color:#BFBFBF;margin-top:2px;" id="fileStats">尚无文件</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="mc-btn" id="dlBtn" disabled onclick="alert('[模拟] 下载: mod.zip')">⬇ 下载mod</button>
          <button class="mc-btn-dark" onclick="resetAll()">🔄 重新生成</button>
        </div>
      </div>
    </div>

    <!-- 右面板 -->
    <div class="terminal">
      <div class="terminal-header">
        <span style="font-weight:bold;font-size:12px;">智能体工作台</span>
        <span style="margin-left:auto;font-size:10px;color:#898989;" id="evCount">0 事件</span>
      </div>
      <div class="terminal-body" id="termBody">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#525252;font-size:12px;gap:8px;">
          <span style="width:6px;height:6px;background:#34D399;border-radius:50%;animation:dotBlink 1.5s ease-in-out infinite;"></span>
          等待智能体输出...
        </div>
        <style>@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:0.3}}</style>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== MC原版音效（使用Web Audio API模拟） ====================

/** MC原版经验升级音效 "ding" - 短促明亮的双音 */
function playMcLevelUp() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // MC升级音: 高音叮叮两声
    [1200, 1600].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.1);
      g.gain.setValueAtTime(0.2, now + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.2);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.2);
    });
    setTimeout(() => ctx.close(), 800);
  } catch(e) {}
}

/** MC原版附魔音效 - 低沉的魔法嗡鸣 + 银河升调 */
function playMcEnchantSound(callback) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    
    // 第一层：低沉持续嗡声（模拟附魔台）
    [70, 105].forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, now);
      o.frequency.linearRampToValueAtTime(f * 0.4, now + 2.2);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 2.5);
    });
    
    // 第二层：神秘升调
    [180,260,350,480,620,780,960,1160,1380].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, now + 0.9 + i * 0.14);
      g.gain.setValueAtTime(0.1, now + 0.9 + i * 0.14);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.9 + i * 0.14 + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + 0.9 + i * 0.14); o.stop(now + 0.9 + i * 0.14 + 0.35);
    });
    
    // 第三层：魔法爆发
    [130,260,390,520,780,1040].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i < 3 ? 'square' : 'sine';
      o.frequency.setValueAtTime(f * 2, now + 2.0);
      o.frequency.exponentialRampToValueAtTime(f, now + 2.8);
      g.gain.setValueAtTime(0.12, now + 2.0);
      g.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
      o.connect(g); g.connect(ctx.destination);
      o.start(now + 2.0); o.stop(now + 2.8);
    });
    
    setTimeout(() => { ctx.close(); if(callback) callback(); }, 3300);
  } catch(e) { if(callback) callback(); }
}

// ==================== 全局状态 ====================
const S = {
  running: false, finished: false,
  dispLvl: 0, prevFloored: 0,
  enchPhase: 'idle',
  enchTimers: [],
  promptText: '请帮我生成一个Minecraft Mod，添加一把附魔的钻石剑和自定义护甲...'
};

const PHASES = ['思考', '执行', '生成', '附魔完成!'];
const ICONS = ['📖', '⛏️', '🔧', '📚'];

// ==================== 初始化UI ====================
function buildXpSegments() {
  const segs = document.getElementById('xpSegs');
  segs.innerHTML = '';
  for (let i = 1; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'xp-seg'; s.style.left = (i/30*100) + '%';
    segs.appendChild(s);
  }
}

function buildPhases() {
  const p = document.getElementById('phases');
  p.innerHTML = '';
  PHASES.forEach((label, i) => {
    const d = document.createElement('div');
    d.className = 'phase';
    d.innerHTML = `<span class="phase-icon" id="pi${i}">${ICONS[i]}</span><span class="phase-label" id="pl${i}">○ ${label}</span>`;
    p.appendChild(d);
  });
}

function updatePhases(active) {
  for (let i = 0; i < 4; i++) {
    const pi = document.getElementById('pi' + i), pl = document.getElementById('pl' + i);
    if (!pi || !pl) continue;
    const done = S.finished || (S.running && i <= active);
    const act = S.running && i === active;
    pi.parentElement.className = 'phase' + (act ? ' active' : done ? ' done' : '');
    pl.textContent = (act ? '⚡ ' : done ? '✓ ' : '○ ') + PHASES[i];
  }
}

function updateXpBar() {
  const pct = Math.min((S.dispLvl / 30) * 100, 100);
  const fl = Math.floor(S.dispLvl);
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpFill').className = 'xp-fill' + (S.finished ? ' finished' : '');
  const num = document.getElementById('xpNum');
  num.textContent = fl;
  num.className = 'xp-level-num' + (S.finished ? ' finished' : '');
  document.getElementById('xpShine').style.display = (S.running && !S.finished) ? 'block' : 'none';
}

function addEvent(type, content, toolName, args) {
  S.events = S.events || [];
  S.events.push({ type, content, toolName, args });
  const body = document.getElementById('termBody');
  if (S.events.length === 1) body.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'event-line';
  let html = '';
  if (type === 'thinking') {
    html = `<span class="event-thinking">🧠 思考</span> · ${content}`;
  } else if (type === 'tool_call') {
    html = `<span class="event-tool">🔧 工具调用</span> · <span style="color:#22D3EE;">${toolName}</span> ${args ? '· '+args.slice(0,50) : ''}`;
  } else if (type === 'done') {
    html = `<span class="event-done">✅ ${content}</span>`;
  }
  el.innerHTML = html;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  document.getElementById('evCount').textContent = S.events.length + ' 事件';
}

function updateStats() {
  const fc = S.finished ? 12 + Math.floor(Math.random()*8) : S.events && S.events.length > 5 ? Math.floor(S.events.length * 0.4) : 0;
  document.getElementById('fileStats').textContent = fc > 0 ? fc + ' 个文件 · ' + (fc*24+Math.random()*10).toFixed(1) + ' KB' : '尚无文件';
}

// ==================== 附魔动画 ====================
function genRunes() {
  const c = document.getElementById('enchantParticles');
  c.innerHTML = '';
  const runes = 'ᛃ⚡✦ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛊᛏᛒ'.split('');
  const colors = ['#AA00FF','#00FFAA','#FFD700','#FF55FF','#55AAFF'];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.className = 'enchant-rune';
    s.textContent = runes[Math.floor(Math.random()*runes.length)];
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2.5}s;font-size:${Math.random()*22+12}px;color:${colors[Math.floor(Math.random()*5)]};`;
    c.appendChild(s);
  }
}

function genXpOrbs() {
  const c = document.getElementById('xpOrbs');
  c.innerHTML = '';
  const colors = ['#FF55FF','#55FF55','#FFD700','#AA00FF','#55FFAA'];
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'xp-orb';
    d.style.cssText = `background:${colors[i%5]};box-shadow:0 0 10px ${colors[i%5]};animation-delay:${i*0.1}s;`;
    c.appendChild(d);
  }
}

function setEnchPhase(phase) {
  S.enchPhase = phase;
  const ov = document.getElementById('enchantOverlay');
  const stage = document.getElementById('bookStage');
  const book = document.getElementById('book');
  const inner = document.getElementById('bookInner');
  const hint = document.getElementById('bottomHint');
  const o1=document.getElementById('or1'),o2=document.getElementById('or2'),o3=document.getElementById('or3');
  const orbs = document.getElementById('xpOrbs');
  
  stage.className = 'book-stage';
  ov.classList.add('active');
  const showR = phase === 'enchanting' || phase === 'enchanted';
  o1.style.display=o2.style.display=o3.style.display=showR?'block':'none';
  orbs.style.display=showR?'flex':'none';
  
  switch(phase) {
    case 'bookAppear':
      stage.classList.add('anim-appear');
      book.className = 'mc-book';
      inner.innerHTML = `
        <span style="font-size:15px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📖 需求之书</span>
        <div style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);word-break:break-all;">
          <p style="font-size:10px;color:#BCAAA4;line-height:1.4;max-height:60px;overflow:hidden;">${S.promptText}</p>
        </div>
      `;
      hint.innerHTML = '§a* 翻开需求之书... *';
      break;
    case 'flip':
      stage.classList.add('anim-flip');
      book.className = 'mc-book';
      inner.innerHTML = `
        <span style="font-size:15px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📜 翻页中...</span>
        <div style="margin-top:10px;font-size:30px;opacity:0.3;">📄</div>
      `;
      hint.innerHTML = '§e* 书页翻动中... *';
      break;
    case 'enchanting':
      stage.classList.add('anim-enchanting');
      book.className = 'mc-book';
      inner.innerHTML = `
        <span style="font-size:15px;color:#D7CCC8;font-weight:bold;text-shadow:0 2px 0 #000;">📖 需求之书</span>
        <div style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);">
          <p style="font-size:10px;color:#BCAAA4;line-height:1.4;max-height:60px;overflow:hidden;">${S.promptText}</p>
        </div>
      `;
      hint.innerHTML = '§d✦ 奥术能量涌动！✦';
      genRunes(); genXpOrbs();
      break;
    case 'enchanted':
      stage.className = 'book-stage anim-enchanted';
      book.className = 'mc-book enchanted';
      const runes = 'ᛟᚹᛖᚱᚠᚢᛚᛚᛟᚹᛖᚱᚠᚢᛚᛚ'.split('');
      inner.innerHTML = `
        <span style="font-size:32px;">📚</span>
        <div style="margin-top:8px;"><span class="ench-text">附魔完成!</span></div>
        <div class="rune-row">${runes.map((r,i) => `<span class="rune-char" style="animation-delay:${i*0.06}s;">${r}</span>`).join('')}</div>
      `;
      hint.innerHTML = '§5✦ Mod已附魔成功！✦';
      break;
    case 'done':
      ov.classList.remove('active');
      break;
  }
}

function triggerEnchant() {
  clearEnchTimers();
  setEnchPhase('bookAppear');
  const t = [];
  t.push(setTimeout(() => setEnchPhase('flip'), 800));
  t.push(setTimeout(() => {
    setEnchPhase('enchanting');
    playMcEnchantSound(() => {
      setEnchPhase('enchanted');
      t.push(setTimeout(() => setEnchPhase('done'), 2200));
    });
  }, 1700));
  S.enchTimers = t;
}

function clearEnchTimers() {
  S.enchTimers.forEach(clearTimeout);
  S.enchTimers = [];
}

// ==================== 模拟运行 ====================
let simTimer = null; let simSec = 0; let evCtr = 0;

const thinkMsgs = [
  '分析用户需求：需要生成一个新的Minecraft Mod...',
  '正在解析Mod类型和功能需求...',
  '检查Forge / NeoForge 兼容性...',
  '规划Mod项目目录结构...',
  '确定需要注册的方块和物品类型...',
  '设计合成配方与掉落表...',
  '评估事件监听器需求...',
  '考虑与其他模组的兼容性...',
];

const tools = [
  ['write_file', 'src/main/java/com/example/mod/Main.java'],
  ['write_file', 'src/main/java/com/example/mod/Config.java'],
  ['write_file', 'src/main/java/com/example/mod/items/ModItems.java'],
  ['write_file', 'src/main/java/com/example/mod/blocks/ModBlocks.java'],
  ['write_file', 'src/main/resources/assets/mod/lang/zh_cn.json'],
  ['write_file', 'src/main/java/com/example/mod/events/ModEvents.java'],
  ['write_file', 'build.gradle'],
  ['write_file', 'src/main/resources/META-INF/mods.toml'],
];

const totalEvents = thinkMsgs.length + tools.length * 2 + 3;

function toggleSim() {
  S.running ? stopSim() : startSim();
}

function startSim() {
  S.running = true; S.finished = false; S.events = [];
  S.dispLvl = 0; S.prevFloored = 0; S.enchPhase = 'idle';
  simSec = 0; evCtr = 0;
  
  document.getElementById('termBody').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#525252;font-size:12px;gap:8px;"><span style="width:6px;height:6px;background:#34D399;border-radius:50%;animation:dotBlink 1.5s ease-in-out infinite;"></span>等待智能体输出...</div>`;
  document.getElementById('evCount').textContent = '0 事件';
  document.getElementById('simBtn').textContent = '⏹ 停止模拟';
  document.getElementById('simBtn').classList.add('running');
  document.getElementById('simInfo').textContent = '模拟运行中...';
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('statusVal').textContent = '生成中';
  document.getElementById('xpFill').classList.remove('finished');
  document.getElementById('enchantOverlay').classList.remove('active');
  clearEnchTimers();
  updateXpBar(); updatePhases(0);
  
  simTimer = setInterval(tick, 850);
}

function tick() {
  simSec += 0.85; evCtr++;
  
  if (evCtr <= thinkMsgs.length) {
    addEvent('thinking', thinkMsgs[evCtr-1] + ' [...]');
  } else if (evCtr <= thinkMsgs.length + tools.length * 2) {
    const ti = Math.floor((evCtr - thinkMsgs.length - 1) / 2);
    if (ti < tools.length) {
      addEvent('tool_call', '', tools[ti][0], tools[ti][1]);
    }
  } else if (evCtr <= totalEvents) {
    addEvent('done', '任务进度更新...');
  }

  const progress = Math.min(evCtr / totalEvents, 0.96);
  const target = Math.min(progress * 30, 29.5);
  animateLvl(target);
  
  const m = Math.floor(simSec/60), s = Math.floor(simSec%60);
  document.getElementById('timeVal').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  
  let ap = 0;
  if (evCtr > thinkMsgs.length) ap = 1;
  if (evCtr > thinkMsgs.length + tools.length) ap = 2;
  updatePhases(ap); updateStats();
  
  if (progress >= 0.96) finishSim();
}

function finishSim() {
  clearInterval(simTimer); simTimer = null;
  S.running = false; S.finished = true;
  animateLvl(30);
  
  document.getElementById('simBtn').textContent = '▶ 模拟Mod生成';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '完成！触发附魔动画...';
  document.getElementById('dlBtn').disabled = false;
  document.getElementById('statusVal').textContent = '已完成';
  document.getElementById('xpFill').classList.add('finished');
  updatePhases(3); updateStats();
  
  setTimeout(() => triggerEnchant(), 600);
}

function stopSim() {
  clearInterval(simTimer); simTimer = null;
  clearEnchTimers();
  S.running = false;
  document.getElementById('simBtn').textContent = '▶ 模拟Mod生成';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '已停止';
  document.getElementById('enchantOverlay').classList.remove('active');
}

function resetAll() {
  stopSim(); clearEnchTimers();
  S.running = false; S.finished = false; S.events = [];
  S.dispLvl = 0; S.prevFloored = 0; S.enchPhase = 'idle';
  simSec = 0; evCtr = 0;
  
  document.getElementById('enchantOverlay').classList.remove('active');
  document.getElementById('simBtn').textContent = '▶ 模拟Mod生成';
  document.getElementById('simBtn').classList.remove('running');
  document.getElementById('simInfo').textContent = '点击按钮观察完整动画流程';
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('statusVal').textContent = '等待中';
  document.getElementById('timeVal').textContent = '00:00';
  document.getElementById('fileStats').textContent = '尚无文件';
  document.getElementById('xpFill').classList.remove('finished');
  updateXpBar(); updatePhases(-1);
  document.getElementById('termBody').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#525252;font-size:12px;gap:8px;"><span style="width:6px;height:6px;background:#34D399;border-radius:50%;animation:dotBlink 1.5s ease-in-out infinite;"></span>等待智能体输出...</div>`;
  document.getElementById('evCount').textContent = '0 事件';
}

// ==================== 等级动画 ====================
let lvlAF = null;
function animateLvl(target) {
  if (lvlAF) cancelAnimationFrame(lvlAF);
  const step = () => {
    const diff = target - S.dispLvl;
    if (Math.abs(diff) < 0.08) { S.dispLvl = target; updateXpBar(); lvlAF = null; return; }
    S.dispLvl += Math.sign(diff) * 0.35;
    S.dispLvl = Math.round(S.dispLvl*10)/10;
    updateXpBar();
    const fl = Math.floor(S.dispLvl);
    if (fl > S.prevFloored && fl > 0) {
      S.prevFloored = fl;
      const flash = document.getElementById('xpFlash');
      flash.innerHTML = '<div class="xp-glow-flash"></div>';
      setTimeout(() => flash.innerHTML = '', 350);
      const pop = document.getElementById('lvlPop');
      document.getElementById('lvlPopText').textContent = fl + '级!';
      pop.style.display = 'block';
      setTimeout(() => pop.style.display = 'none', 1500);
      playMcLevelUp();
    }
    lvlAF = requestAnimationFrame(step);
  };
  lvlAF = requestAnimationFrame(step);
}

// ==================== MC背景画布 ====================
function initBg() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      vx: (Math.random()-0.5)*0.3, vy: -(Math.random()*0.4+0.1),
      size: Math.random()*2+1, life: Math.random()*300+100
    });
  }
  
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life < 0 || p.y < -10) { p.x = Math.random()*canvas.width; p.y = canvas.height+10; p.life = Math.random()*300+100; }
      const alpha = Math.min(p.life/100, 0.4);
      ctx.fillStyle = `rgba(52,211,153,${alpha})`;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ==================== 启动 ====================
buildXpSegments(); buildPhases(); updateXpBar(); updatePhases(-1); initBg();
</script>
